<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programmer Calculator — AP Bloch</title>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="calc.css?v=9" />
</head>
<body>
  <header>
    <h1><a href="../../" style="color:inherit;text-decoration:none">Tools</a></h1>
    <nav>
      <a href="./" class="active">Programmer Calculator</a>
    </nav>
  </header>

  <main class="calc-main">
    <div class="calc-wrap">

      <!-- Top bar: mode + width + fullscreen -->
      <div class="top-bar">
        <div class="btn-group" id="mode-group">
          <button data-mode="dec" class="selected">DEC</button>
          <button data-mode="hex">HEX</button>
          <button data-mode="oct">OCT</button>
          <button data-mode="bin">BIN</button>
          <button data-mode="sci">SCI</button>
        </div>
        <div class="top-right">
          <div class="btn-group" id="width-group">
            <button data-bits="8">8</button>
            <button data-bits="16">16</button>
            <button data-bits="32" class="selected">32</button>
            <button data-bits="64">64</button>
          </div>
          <button id="fs-btn" class="icon-btn" title="Enter fullscreen">⛶</button>
        </div>
      </div>

      <!-- Display -->
      <div class="display-box">
        <div class="display-top">
          <div class="btn-group" id="sign-group">
            <button data-sign="signed" class="selected" title="Signed">S</button>
            <button data-sign="unsigned" title="Unsigned">U</button>
          </div>
          <div class="display-expr" id="display-expr"></div>
        </div>
        <div class="display-main" id="display-main">0</div>
        <div class="display-secondary" id="display-secondary"></div>
      </div>

      <!-- History -->
      <div class="history-panel" id="history-panel">
        <div class="history-header">
          <span class="history-label">HISTORY <span class="history-count" id="history-count"></span></span>
          <button id="history-clear" class="icon-btn" title="Clear history">×</button>
        </div>
        <div class="history-list" id="history-list"></div>
      </div>

      <!-- Bit grid -->
      <div class="bit-grid-wrap">
        <div class="bit-grid" id="bit-grid"></div>
      </div>

      <!-- Bitwise ops row -->
      <div class="bitwise-row">
        <button class="op-btn" data-op="AND">AND</button>
        <button class="op-btn" data-op="OR">OR</button>
        <button class="op-btn" data-op="XOR">XOR</button>
        <button class="op-btn" data-op="NOT">NOT</button>
        <button class="op-btn" data-op="LSH">LSH</button>
        <button class="op-btn" data-op="RSH">RSH</button>
      </div>

      <!-- Keypad -->
      <div class="keypad">
        <!-- Row 1 -->
        <button class="key hex-only" data-key="A">A</button>
        <button class="key hex-only" data-key="B">B</button>
        <button class="key hex-only" data-key="C">C</button>
        <button class="key fn" data-key="CE">CE</button>
        <button class="key fn" data-key="BACK">⌫</button>

        <!-- Row 2 -->
        <button class="key hex-only" data-key="D">D</button>
        <button class="key hex-only" data-key="E">E</button>
        <button class="key hex-only" data-key="F">F</button>
        <button class="key fn" data-key="(">(</button>
        <button class="key fn" data-key=")">)</button>

        <!-- Row 3 -->
        <button class="key digit" data-key="7">7</button>
        <button class="key digit" data-key="8">8</button>
        <button class="key digit" data-key="9">9</button>
        <button class="key op" data-key="÷">÷</button>

        <!-- Row 4 -->
        <button class="key digit" data-key="4">4</button>
        <button class="key digit" data-key="5">5</button>
        <button class="key digit" data-key="6">6</button>
        <button class="key op" data-key="×">×</button>

        <!-- Row 5 -->
        <button class="key digit" data-key="1">1</button>
        <button class="key digit" data-key="2">2</button>
        <button class="key digit" data-key="3">3</button>
        <button class="key op" data-key="−">−</button>

        <!-- Row 6 -->
        <button class="key fn" data-key="NEG">±</button>
        <button class="key digit" data-key="0">0</button>
        <button class="key eq" data-key="=">=</button>
        <button class="key op" data-key="+">+</button>
      </div>

    </div>
  </main>

  <script src="calc.js?v=8"></script>
</body>
</html>
